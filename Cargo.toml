[workspace]
resolver = "2"
members = ["."]

[workspace.package]
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/cap"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.release.package.cap]
opt-level = "z"
codegen-units = 1
strip = true

[profile.bench.package.cap]
opt-level = "z"
codegen-units = 1
strip = true

[package]
name = "cap"
version = "0.4.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "cap — local resource-protection daemon + CLI wrapper for heavy commands (cargo test, uv run, ...)"

[features]
default = ["release"]
release = ["cli-std/online"]

[lib]
name = "cap"
path = "src/lib.rs"

[[bin]]
name = "cap-full"
path = "src/full_main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "5"
libc = "0.2"
toml = "0.8"
chrono.workspace = true
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }

[dev-dependencies]
tempfile = "3"
meter = { git = "https://github.com/faberline/meter", rev = "6689b38705978657eef0c3f8e12a937c416c5deb", default-features = false, features = ["embed"] }
# `test-util` enables `tokio::time::pause`, `tokio::time::advance`, and
# the `start_paused` attribute used by Slice 4 grace-period tests.
tokio = { workspace = true, features = ["full", "test-util"] }

[[bench]]
name = "command_resources"
harness = false
